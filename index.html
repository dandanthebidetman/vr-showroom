<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Virtual Showroom</title>
<style>
  :root{ --bg:#0e1116; --panel:rgba(20,24,31,.82); --accent:#2f6df6; --text:#eef1f6; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none}

  #stage{position:fixed;inset:0;background:#000;overflow:hidden}
  #photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transition:opacity .5s ease;will-change:opacity}
  #photo.fade{opacity:0}

  /* ---- Myst-style hotspot zones ---- */
  #zones{position:absolute;inset:0;z-index:10}
  .zone{position:absolute;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .18s;pointer-events:none}
  /* available directions stay visible (dimmed), and brighten on hover */
  .zone.live{pointer-events:auto;cursor:pointer;opacity:.62}
  body.arrows-off .zone.live{opacity:0}
  body.arrows-off .zone.live:hover{opacity:1}
  .zone .glyph{font-size:30px;color:#fff;line-height:1;
    width:62px;height:62px;border-radius:50%;
    background:rgba(20,28,44,.55);border:2px solid rgba(255,255,255,.85);
    box-shadow:0 3px 12px rgba(0,0,0,.55);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
    transform:scale(.92);transition:transform .18s,background .18s}
  .zone.live:hover{opacity:1}
  .zone.live:hover .glyph{transform:scale(1.08);background:var(--accent)}
  /* gentle pulse so they read as interactive */
  @keyframes nudge{0%,100%{transform:scale(.92)}50%{transform:scale(1)}}
  .zone.live .glyph{animation:nudge 2.4s ease-in-out infinite}
  .zone.live:hover .glyph{animation:none}

  #z-forward{left:30%;right:30%;top:18%;bottom:30%}
  #z-back{left:25%;right:25%;bottom:0;height:18%}
  #z-left{left:0;top:15%;bottom:18%;width:22%;justify-content:flex-start;padding-left:18px}
  #z-right{right:0;top:15%;bottom:18%;width:22%;justify-content:flex-end;padding-right:18px}

  /* Top bar */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;
    gap:14px;padding:14px 18px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
  #title{font-size:15px;font-weight:600}
  #counter{font-size:13px;opacity:.7}
  .spacer{flex:1}
  .iconbtn{background:var(--panel);border:1px solid rgba(255,255,255,.12);color:var(--text);
    width:40px;height:40px;border-radius:10px;font-size:16px;cursor:pointer;backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;transition:.15s}
  .iconbtn:hover{background:var(--accent);border-color:var(--accent)}
  .iconbtn.on{background:var(--accent);border-color:var(--accent)}

  /* Thumbnail strip / map (kept as a quick jump aid) */
  #map{position:fixed;inset:0;z-index:40;background:rgba(8,10,14,.96);display:none;
    padding:60px 24px 24px;overflow-y:auto}
  #map.show{display:block}
  #map h2{font-size:18px;margin-bottom:16px;font-weight:600}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent}
  .card img{width:100%;height:110px;object-fit:cover;display:block}
  .card span{position:absolute;left:0;bottom:0;right:0;padding:5px 8px;font-size:12px;
    background:linear-gradient(0deg,rgba(0,0,0,.8),transparent)}
  .card:hover{border-color:var(--accent)}
  #closemap{position:fixed;top:14px;right:18px;z-index:41}

  #hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;font-size:12.5px;
    opacity:.65;background:rgba(0,0,0,.45);padding:7px 14px;border-radius:20px;pointer-events:none;
    transition:opacity .4s}
  #hint.gone{opacity:0}
  @media(max-width:600px){.zone .glyph{font-size:34px}}
</style>
</head>
<body>
  <div id="stage">
    <img id="photo" alt="Showroom view">
    <div id="zones">
      <div class="zone" id="z-left"   data-dir="left"><div class="glyph">‹</div></div>
      <div class="zone" id="z-right"  data-dir="right"><div class="glyph">›</div></div>
      <div class="zone" id="z-forward" data-dir="forward"><div class="glyph">⬆</div></div>
      <div class="zone" id="z-back"   data-dir="back"><div class="glyph">⬇</div></div>
    </div>
  </div>

  <div id="topbar">
    <div>
      <div id="title">Virtual Showroom</div>
      <div id="counter"></div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="zonebtn" title="Show movement arrows">✥</button>
    <button class="iconbtn" id="mapbtn" title="All views">▦</button>
    <button class="iconbtn" id="fsbtn" title="Fullscreen">⛶</button>
  </div>

  <div id="hint">Lit circles show where you can go — click to move, or use arrow keys. ✥ hides them.</div>

  <div id="map">
    <button class="iconbtn" id="closemap">✕</button>
    <h2>All views — click to jump</h2>
    <div id="grid"></div>
  </div>

  <script src="manifest.js"></script>
  <script>
  (function(){
    const scenes = window.SHOWROOM_SCENES || [];
    const byId = {}; scenes.forEach(s=>byId[s.id]=s);
    const photo = document.getElementById('photo');
    const counter = document.getElementById('counter');
    const title = document.getElementById('title');
    const grid = document.getElementById('grid');
    const zones = [...document.querySelectorAll('.zone')];
    const hint = document.getElementById('hint');
    let cur = scenes.length ? scenes[0] : null;

    function refreshZones(){
      const links = (cur && cur.links) || {};
      zones.forEach(z=>{
        const dir=z.dataset.dir;
        const target=links[dir];
        const ok = target!=null && byId[target];
        z.classList.toggle('live', !!ok);
        z.title = ok ? ('Go '+dir+' → '+(byId[target].title||('Stop '+target))) : '';
      });
    }

    function go(id){
      const s=byId[id]; if(!s) return;
      photo.classList.add('fade');
      setTimeout(()=>{
        cur=s;
        photo.src=s.file;
        title.textContent=s.title||('View '+s.id);
        counter.textContent='Stop '+s.id+' of '+scenes.length;
        photo.onload=()=>photo.classList.remove('fade');
        refreshZones();
      },190);
    }

    zones.forEach(z=>z.addEventListener('click',()=>{
      if(!z.classList.contains('live')) return;
      go(cur.links[z.dataset.dir]);
    }));

    // build jump grid
    scenes.forEach(s=>{
      const c=document.createElement('div'); c.className='card';
      c.innerHTML='<img src="'+(s.thumb||s.file)+'" loading="lazy"><span>'+(s.title||('Stop '+s.id))+'</span>';
      c.onclick=()=>{document.getElementById('map').classList.remove('show');go(s.id);};
      grid.appendChild(c);
    });

    // controls
    document.getElementById('mapbtn').onclick=()=>document.getElementById('map').classList.add('show');
    document.getElementById('closemap').onclick=()=>document.getElementById('map').classList.remove('show');
    document.getElementById('zonebtn').classList.add('on');
    document.getElementById('zonebtn').onclick=function(){
      const off=document.body.classList.toggle('arrows-off');
      this.classList.toggle('on',!off);
    };
    document.getElementById('fsbtn').onclick=()=>{
      if(!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    document.addEventListener('keydown',e=>{
      const l=(cur&&cur.links)||{};
      if(e.key==='ArrowUp'&&l.forward!=null) go(l.forward);
      else if(e.key==='ArrowDown'&&l.back!=null) go(l.back);
      else if(e.key==='ArrowLeft'&&l.left!=null) go(l.left);
      else if(e.key==='ArrowRight'&&l.right!=null) go(l.right);
      else if(e.key==='Escape') document.getElementById('map').classList.remove('show');
    });
    // fade the hint after first move or 6s
    setTimeout(()=>hint.classList.add('gone'),6000);
    document.getElementById('zones').addEventListener('click',()=>hint.classList.add('gone'));

    if(cur){ go(cur.id); } else { title.textContent='No images found — add photos to images/'; }
  })();
  </script>
</body>
</html>
